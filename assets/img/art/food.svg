<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="fd-t" preserveAspectRatio="xMidYMid slice">
  <title id="fd-t">Assorted food and agricultural products</title>
  <defs>
    <linearGradient id="fdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241a10"/><stop offset="48%" stop-color="#3d2c17"/><stop offset="100%" stop-color="#5c421d"/>
    </linearGradient>
    <radialGradient id="fdGlow" cx="28%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity=".34"/><stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bTurmeric" cx="36%" cy="30%" r="72%"><stop offset="0%" stop-color="#f7c94b"/><stop offset="100%" stop-color="#c8860e"/></radialGradient>
    <radialGradient id="bChilli"   cx="36%" cy="30%" r="72%"><stop offset="0%" stop-color="#e2542f"/><stop offset="100%" stop-color="#96240f"/></radialGradient>
    <radialGradient id="bPulse"    cx="36%" cy="30%" r="72%"><stop offset="0%" stop-color="#9dbf58"/><stop offset="100%" stop-color="#5a7a2a"/></radialGradient>
    <radialGradient id="bRice"     cx="36%" cy="30%" r="72%"><stop offset="0%" stop-color="#fdf6e6"/><stop offset="100%" stop-color="#d9c8a4"/></radialGradient>
    <radialGradient id="bPepper"   cx="36%" cy="30%" r="72%"><stop offset="0%" stop-color="#5a4a3c"/><stop offset="100%" stop-color="#241a12"/></radialGradient>
    <radialGradient id="bLentil"   cx="36%" cy="30%" r="72%"><stop offset="0%" stop-color="#f0a355"/><stop offset="100%" stop-color="#b8641a"/></radialGradient>
    <filter id="fdN"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/><feColorMatrix values="0 0 0 0 0.28 0 0 0 0 0.2 0 0 0 0 0.1 0 0 0 .26 0"/></filter>
  </defs>

  <rect width="900" height="560" fill="url(#fdBg)"/>
  <rect width="900" height="560" fill="url(#fdGlow)"/>

  <!-- Faint sack / crate grid behind the spread -->
  <g stroke="#e3bd68" stroke-opacity=".08" stroke-width="1" fill="none">
    <path d="M0 120h900M0 300h900M0 470h900M180 0v560M420 0v560M660 0v560"/>
  </g>

  <!-- Bowls, overhead. Rim + fill + grain texture. -->
  <g>
    <g transform="translate(200 210)">
      <circle r="96" fill="#1a120a" fill-opacity=".55"/><circle r="88" fill="url(#bTurmeric)"/>
      <circle r="88" fill="none" stroke="#ffe6a8" stroke-opacity=".5" stroke-width="2.5"/>
      <g fill="#7a4d06" fill-opacity=".35"><circle cx="-30" cy="-22" r="6"/><circle cx="12" cy="-38" r="5"/><circle cx="34" cy="6" r="6"/><circle cx="-14" cy="26" r="5"/><circle cx="-48" cy="14" r="4"/><circle cx="24" cy="46" r="4"/><circle cx="-8" cy="-6" r="4"/></g>
    </g>

    <g transform="translate(400 148)">
      <circle r="76" fill="#1a120a" fill-opacity=".55"/><circle r="69" fill="url(#bChilli)"/>
      <circle r="69" fill="none" stroke="#ffb9a0" stroke-opacity=".42" stroke-width="2.5"/>
      <g fill="#5e1608" fill-opacity=".4"><ellipse cx="-22" cy="-16" rx="16" ry="6" transform="rotate(-28 -22 -16)"/><ellipse cx="18" cy="-28" rx="14" ry="5" transform="rotate(22 18 -28)"/><ellipse cx="26" cy="14" rx="15" ry="6" transform="rotate(-14 26 14)"/><ellipse cx="-12" cy="28" rx="13" ry="5" transform="rotate(38 -12 28)"/></g>
    </g>

    <g transform="translate(578 244)">
      <circle r="84" fill="#1a120a" fill-opacity=".55"/><circle r="77" fill="url(#bRice)"/>
      <circle r="77" fill="none" stroke="#fffaf0" stroke-opacity=".55" stroke-width="2.5"/>
      <!-- eggs nested in the cream bowl -->
      <g fill="#fffdf7" stroke="#b9a37a" stroke-opacity=".45">
        <ellipse cx="-26" cy="-14" rx="19" ry="25"/><ellipse cx="16" cy="-26" rx="18" ry="24"/><ellipse cx="30" cy="14" rx="18" ry="24"/><ellipse cx="-10" cy="26" rx="18" ry="24"/>
      </g>
      <g fill="#fff" fill-opacity=".7"><ellipse cx="-32" cy="-24" rx="5" ry="7"/><ellipse cx="10" cy="-36" rx="5" ry="7"/></g>
    </g>

    <g transform="translate(742 130)">
      <circle r="58" fill="#1a120a" fill-opacity=".5"/><circle r="52" fill="url(#bPulse)"/>
      <circle r="52" fill="none" stroke="#d8ecab" stroke-opacity=".42" stroke-width="2"/>
      <g fill="#3c5418" fill-opacity=".4"><circle cx="-18" cy="-12" r="5"/><circle cx="8" cy="-22" r="4"/><circle cx="20" cy="6" r="5"/><circle cx="-6" cy="18" r="4"/><circle cx="-28" cy="10" r="3"/></g>
    </g>

    <g transform="translate(318 372)">
      <circle r="72" fill="#1a120a" fill-opacity=".5"/><circle r="65" fill="url(#bLentil)"/>
      <circle r="65" fill="none" stroke="#ffd6a8" stroke-opacity=".42" stroke-width="2.2"/>
      <g fill="#7d3f0c" fill-opacity=".35"><circle cx="-20" cy="-14" r="5"/><circle cx="10" cy="-24" r="4"/><circle cx="24" cy="8" r="5"/><circle cx="-8" cy="22" r="4"/><circle cx="-34" cy="8" r="4"/></g>
    </g>

    <g transform="translate(508 424)">
      <circle r="60" fill="#1a120a" fill-opacity=".5"/><circle r="54" fill="url(#bPepper)"/>
      <circle r="54" fill="none" stroke="#c9b79c" stroke-opacity=".38" stroke-width="2"/>
      <g fill="#0f0a06" fill-opacity=".5"><circle cx="-16" cy="-12" r="6"/><circle cx="10" cy="-20" r="5"/><circle cx="20" cy="8" r="6"/><circle cx="-6" cy="20" r="5"/><circle cx="-30" cy="6" r="4"/></g>
      <g fill="#fff" fill-opacity=".14"><circle cx="-18" cy="-16" r="2.5"/><circle cx="8" cy="-24" r="2"/></g>
    </g>

    <g transform="translate(714 400)">
      <circle r="52" fill="#1a120a" fill-opacity=".5"/><circle r="46" fill="url(#bTurmeric)" opacity=".82"/>
      <circle r="46" fill="none" stroke="#ffe6a8" stroke-opacity=".38" stroke-width="2"/>
      <g stroke="#7a4d06" stroke-opacity=".4" stroke-width="3" fill="none" stroke-linecap="round"><path d="M-20-8c10 8 22 8 32 0M-16 8c12 8 24 6 34-2"/></g>
    </g>
  </g>

  <!-- Loose grains scattered on the surface -->
  <g fill="#ffe6a8" fill-opacity=".55">
    <circle cx="120" cy="440" r="4"/><circle cx="152" cy="470" r="3"/><circle cx="96" cy="486" r="3"/>
    <circle cx="196" cy="462" r="3"/><circle cx="632" cy="112" r="3"/><circle cx="672" cy="86" r="3"/>
    <circle cx="452" cy="272" r="3"/><circle cx="486" cy="300" r="2.5"/><circle cx="240" cy="316" r="3"/>
  </g>

  <rect width="900" height="560" filter="url(#fdN)" opacity=".5"/>
</svg>
